version: "2"
linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - errorlint
    - bodyclose
    - sqlclosecheck
    - rowserrcheck
issues:
  exclude-rules:
    - path: sync/syncpb/
      linters: [revive, staticcheck]
formatters:
  enable:
    - gofmt
